{% extends "base.html" %}
{% block title %}Sign Up - ApplyMate{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
          <h3 class="fw-bold text-center mb-1">Create your account</h3>
          <p class="text-muted text-center small mb-4">
            Start your automated job-application journey
          </p>

          <form method="POST" action="{{ url_for('signup') }}">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Full Name</label>
              <input type="text" name="full_name" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Email</label>
              <input type="email" name="email" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Password</label>
              <input type="password" name="password" class="form-control form-control-lg" minlength="6" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small">Confirm Password</label>
              <input type="password" name="confirm_password" class="form-control form-control-lg" minlength="6" required>
            </div>
            <button class="btn btn-success btn-lg w-100">
              <i class="fa-solid fa-user-plus me-2"></i> Sign Up
            </button>
          </form>

          <p class="text-center text-muted mt-4 mb-0 small">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-success fw-semibold">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
